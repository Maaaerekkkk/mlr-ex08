<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klasifikátor listov</title>
<style>
  :root { --bg:#f6f7f4; --fg:#1d2a1f; --muted:#5d6b60; --card:#fff; --accent:#2f7d4a; --bar:#dfe7e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121714; --fg:#e6ede7; --muted:#9aa89d; --card:#1b221d; --accent:#5cc282; --bar:#2a332c; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { margin:0 0 12px; color:var(--muted); font-size:.9rem; }
  .card { background:var(--card); border-radius:14px; padding:12px; margin-bottom:14px;
          box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .view { position:relative; width:100%; aspect-ratio:1/1; background:#000; border-radius:10px; overflow:hidden; }
  .view video, .view img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .view .frame { position:absolute; inset:0; border:3px solid rgba(255,255,255,.6); border-radius:10px; pointer-events:none; }
  .view .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                color:#ccc; text-align:center; padding:16px; font-size:.95rem; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button, label.btn { flex:1 1 auto; appearance:none; border:0; border-radius:10px; padding:12px 14px;
          font:inherit; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; text-align:center; }
  button.secondary, label.btn.secondary { background:var(--bar); color:var(--fg); }
  button:disabled { opacity:.5; }
  input[type=file] { display:none; }
  .row { display:grid; grid-template-columns: 5.5rem 1fr 4.2rem; gap:8px; align-items:center; margin:8px 0; }
  .row .name { font-weight:600; }
  .row .track { height:14px; background:var(--bar); border-radius:7px; overflow:hidden; }
  .row .fill { height:100%; width:0; background:var(--accent); transition:width .15s; }
  .row .val { text-align:right; font-variant-numeric:tabular-nums; }
  .row.top .name { color:var(--accent); }
  #status { font-size:.85rem; color:var(--muted); margin-top:6px; min-height:1.2em; word-break:break-word; }
  #check { font-size:.85rem; white-space:pre-wrap; font-family:ui-monospace, Menlo, monospace; margin-top:8px; }
  .ok { color:var(--accent); } .bad { color:#d33; }
  footer .qr { display:flex; gap:14px; align-items:center; }
  footer .qr svg { width:140px; height:140px; flex:none; border-radius:6px; }
  footer .qr > div { flex:1 1 0; min-width:0; font-size:.9rem; }
  footer h2 { font-size:1rem; margin:0 0 8px; }
  footer a { color:var(--accent); word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>🍃 Klasifikátor listov</h1>
  <p class="sub">Namierte zadnú kameru na list – klasifikuje sa stredový štvorec obrazu.</p>

  <section class="card">
    <div class="view" id="view">
      <video id="video" playsinline muted autoplay></video>
      <img id="photo" alt="" hidden>
      <div class="frame"></div>
      <div class="hint" id="hint">Stlačte „Spustiť kameru“ alebo nahrajte fotku.</div>
    </div>
    <div class="btns">
      <button id="camBtn" disabled>Spustiť kameru</button>
      <label class="btn secondary" for="file">Nahrať fotku</label>
      <input type="file" id="file" accept="image/*">
    </div>
    <div id="status">Načítavam model…</div>
  </section>

  <section class="card">
    <div id="probs"></div>
  </section>

  <section class="card">
    <button class="secondary" id="checkBtn" disabled>Overiť check_image.jpg</button>
    <div id="check"></div>
  </section>

  <footer class="card">
    <h2>QR kód – otvoriť túto stránku v mobile</h2>
    <div class="qr">
      <!-- QR vygenerovaný lokálne (segno), kóduje https://maaaerekkkk.github.io/mlr-ex08/ -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 222 222" role="img" aria-label="QR kód: https://maaaerekkkk.github.io/mlr-ex08/"><g transform="scale(6)"><path fill="#fff" d="M0 0h37v37h-37z"/><path class="qrline" stroke="#000" d="M4 4.5h7m4 0h3m2 0h2m4 0h7m-29 1h1m5 0h1m1 0h5m7 0h1m1 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h3m4 0h1m2 0h1m3 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h4m1 0h3m1 0h1m1 0h2m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h2m2 0h2m1 0h5m1 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m2 0h3m4 0h1m1 0h1m1 0h1m1 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-21 1h3m1 0h1m3 0h1m1 0h3m-21 1h1m5 0h1m1 0h1m1 0h2m1 0h1m1 0h1m1 0h1m3 0h2m2 0h3m-26 1h2m4 0h1m1 0h6m3 0h1m3 0h2m1 0h2m-25 1h1m2 0h4m3 0h4m6 0h2m-22 1h1m3 0h2m2 0h2m1 0h1m1 0h1m2 0h3m2 0h2m-25 1h1m1 0h2m1 0h1m1 0h3m1 0h3m1 0h1m3 0h1m1 0h2m4 0h1m-29 1h4m1 0h1m3 0h4m2 0h1m2 0h2m1 0h4m2 0h2m-29 1h2m3 0h2m1 0h1m1 0h1m1 0h1m2 0h1m1 0h2m1 0h2m1 0h4m-27 1h1m1 0h3m3 0h1m1 0h1m3 0h3m1 0h3m3 0h1m1 0h1m1 0h1m-29 1h4m2 0h1m2 0h2m1 0h1m2 0h5m5 0h2m-27 1h2m1 0h1m3 0h1m2 0h2m1 0h1m1 0h6m1 0h3m1 0h3m-29 1h3m2 0h2m1 0h1m1 0h1m1 0h1m2 0h2m2 0h1m2 0h1m1 0h2m2 0h1m-29 1h1m1 0h1m2 0h1m1 0h1m1 0h1m3 0h1m2 0h1m1 0h2m1 0h1m2 0h1m-25 1h1m2 0h1m2 0h1m1 0h1m1 0h2m2 0h1m2 0h1m1 0h6m1 0h3m-21 1h3m1 0h1m1 0h2m1 0h2m1 0h1m3 0h2m-26 1h7m2 0h2m4 0h2m1 0h3m1 0h1m1 0h3m-27 1h1m5 0h1m4 0h1m2 0h1m1 0h1m2 0h2m3 0h1m2 0h2m-29 1h1m1 0h3m1 0h1m3 0h5m1 0h1m2 0h7m2 0h1m-29 1h1m1 0h3m1 0h1m3 0h1m1 0h10m3 0h2m1 0h1m-29 1h1m1 0h3m1 0h1m4 0h1m1 0h5m2 0h8m-28 1h1m5 0h1m5 0h1m2 0h1m7 0h4m1 0h1m-29 1h7m1 0h1m4 0h1m3 0h3m2 0h2m2 0h1"/></g></svg>
      <div>Naskenujte fotoaparátom v iPhone alebo kliknite:<br>
        <a id="pageLink" href="https://maaaerekkkk.github.io/mlr-ex08/">https://maaaerekkkk.github.io/mlr-ex08/</a></div>
    </div>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const status = msg => { $('status').textContent = msg; };

  // Safari na iPhone: bez cross-origin isolation nie sú vlákna k dispozícii -> 1 vlákno, čistý WASM
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';

  let info, session, S;
  try {
    info = await (await fetch('model_info.json', {cache: 'no-cache'})).json();
    S = info.input_size;
    session = await ort.InferenceSession.create('leaf_model.onnx', { executionProviders: ['wasm'] });
  } catch (e) { status('Chyba pri načítaní modelu: ' + e); return; }
  const inName = session.inputNames[0], outName = session.outputNames[0];

  // UI riadky pre každú triedu
  const rows = info.classes.map(c => {
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = `<span class="name">${c}</span><div class="track"><div class="fill"></div></div><span class="val">–</span>`;
    $('probs').appendChild(r);
    return { r, fill: r.querySelector('.fill'), val: r.querySelector('.val') };
  });

  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = S;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const mean = info.mean, std = info.std, N = S * S;
  const data = new Float32Array(3 * N);

  // stredový štvorec -> S×S -> RGB/255 -> (x-mean)/std -> NCHW 1×3×S×S
  async function classify(src, w, h) {
    const side = Math.min(w, h), sx = (w - side) / 2, sy = (h - side) / 2;
    ctx.clearRect(0, 0, S, S);
    ctx.drawImage(src, sx, sy, side, side, 0, 0, S, S);
    const px = ctx.getImageData(0, 0, S, S).data;
    for (let i = 0; i < N; i++) {
      data[i]         = (px[4*i]   / 255 - mean[0]) / std[0];
      data[N + i]     = (px[4*i+1] / 255 - mean[1]) / std[1];
      data[2*N + i]   = (px[4*i+2] / 255 - mean[2]) / std[2];
    }
    const out = await session.run({ [inName]: new ort.Tensor('float32', data, [1, 3, S, S]) });
    const logits = Array.from(out[outName].data);
    const m = Math.max(...logits), ex = logits.map(v => Math.exp(v - m)), sum = ex.reduce((a, b) => a + b, 0);
    return ex.map(v => v / sum);
  }

  function show(p) {
    const best = p.indexOf(Math.max(...p));
    p.forEach((v, i) => {
      rows[i].fill.style.width = (v * 100).toFixed(1) + '%';
      rows[i].val.textContent = (v * 100).toFixed(1) + ' %';
      rows[i].r.classList.toggle('top', i === best);
    });
  }

  status(`Model načítaný (vstup 1×3×${S}×${S}, ${info.classes.length} tried).`);
  $('camBtn').disabled = false; $('checkBtn').disabled = false;

  // ---- živá kamera ----
  const video = $('video'), photo = $('photo');
  let stream = null, running = false;
  async function loop() {
    if (!running) return;
    if (video.readyState >= 2 && video.videoWidth) {
      try { show(await classify(video, video.videoWidth, video.videoHeight)); } catch (e) { status('Chyba: ' + e); }
    }
    requestAnimationFrame(loop);
  }
  function stopCam() {
    running = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; $('camBtn').textContent = 'Spustiť kameru';
  }
  $('camBtn').onclick = async () => {
    if (stream) { stopCam(); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status('Kamera nie je dostupná (vyžaduje HTTPS). Použite nahranie fotky.'); return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream; await video.play();
      photo.hidden = true; video.hidden = false; $('hint').hidden = true;
      $('camBtn').textContent = 'Zastaviť kameru';
      status('Kamera beží – pravdepodobnosti sa aktualizujú živo.');
      running = true; loop();
    } catch (e) { stopCam(); status('Kameru sa nepodarilo spustiť: ' + e.name + ' – ' + e.message); }
  };

  // ---- dekódovanie obrázka ----
  // Safari (ImageIO) dekóduje JPEG inak než libjpeg (PIL/Chromium) – rozdiel až 7 úrovní/pixel,
  // čo pri check_image posunie pravdepodobnosti o ~4 %. JPEG preto dekódujeme cez mozjpeg (WASM),
  // ktorý dáva bit-presne rovnaké pixely ako PIL v každom prehliadači. Iné formáty -> natívne.
  let jpegDecode = null;
  async function decodeToCanvas(blob) {
    const buf = await blob.arrayBuffer();
    const b = new Uint8Array(buf, 0, 3);
    if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) {
      try {
        if (!jpegDecode) jpegDecode = (await import('https://cdn.jsdelivr.net/npm/@jsquash/jpeg@1.5.0/decode.js')).default;
        const id = await jpegDecode(buf);
        const c = document.createElement('canvas'); c.width = id.width; c.height = id.height;
        c.getContext('2d').putImageData(id, 0, 0);
        return { src: c, w: id.width, h: id.height, how: 'mozjpeg' };
      } catch (e) { console.warn('mozjpeg zlyhal, použijem natívny dekodér', e); }
    }
    const img = new Image(); img.src = URL.createObjectURL(blob); await img.decode();
    return { src: img, w: img.naturalWidth, h: img.naturalHeight, how: 'natívne' };
  }
  function showPhoto(blob) {
    photo.src = URL.createObjectURL(blob); photo.hidden = false; video.hidden = true; $('hint').hidden = true;
  }

  // ---- nahranie fotky (záloha) ----
  $('file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    stopCam();
    try {
      showPhoto(f);
      const d = await decodeToCanvas(f);
      show(await classify(d.src, d.w, d.h));
      status(`Fotka ${d.w}×${d.h} klasifikovaná (dekodér: ${d.how}).`);
    } catch (err) { status('Fotku sa nepodarilo spracovať: ' + err); }
  };

  // ---- overenie check_image.jpg vs check_expected.json ----
  $('checkBtn').onclick = async () => {
    try {
      const [blob, exp] = await Promise.all([fetch('check_image.jpg', {cache: 'no-cache'}).then(r => r.blob()),
        fetch('check_expected.json', {cache: 'no-cache'}).then(r => r.json())]);
      stopCam();
      showPhoto(blob);
      const d = await decodeToCanvas(blob);
      const p = await classify(d.src, d.w, d.h);
      show(p);
      let maxDiff = 0, lines = [];
      info.classes.forEach((c, i) => {
        const d = Math.abs(p[i] - exp[c]); maxDiff = Math.max(maxDiff, d);
        lines.push(`${c.padEnd(9)} ${p[i].toFixed(6)}  očak. ${exp[c].toFixed(6)}  Δ ${d.toExponential(1)}`);
      });
      const ok = maxDiff < 1e-3;
      $('check').innerHTML = lines.join('\n') + `\n<b class="${ok ? 'ok' : 'bad'}">${ok ? '✔ ZHODA' : '✘ NEZHODA'} (max Δ = ${maxDiff.toExponential(2)})</b>`;
      window.__checkResult = { ok, maxDiff, p };
    } catch (e) { $('check').textContent = 'Chyba: ' + e; }
  };
})();
</script>
</body>
</html>
